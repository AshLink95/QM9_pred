# Planned sweep (docs/sweeps.md). Submit scripts/train-bunch.sh from N jobs; each job claims runs
# from this list until none are left. Editing this file later only ADDS new runs; existing runs
# (by name) are never duplicated or changed.

# v4: Wannier-only model (energy removed, CLAUDE.md §1) with a recipe aimed at the center
# mean/median (docs/refs.md, CLAUDE.md §6): L1 distance loss, NMS selection + NMS-consistent
# targets, EMA of weights. v3 (energy + Wannier, one-to-one targets, MSE losses) finished in
# runs/wannier_v3/. If runs/wannier_v4/ exists from the earlier energy+Wannier version of this
# plan, delete it before launching. This file is self-contained: `base` is the full run config (a copy of
# configs/gpu.yaml), so nothing else is read.
name: wannier_v4                # runs are written to runs/<name>/
dataset: dataset.pkl            # read-only, shared by all runs
stale_minutes: 30               # no-heartbeat fallback when squeue can't tell if an owner died

# Every run starts from this config (same keys as configs/gpu.yaml); runs below change one key.
base:
  model:
    hidden_dim: 128
    n_layers: 4
    n_elements: 100
    rbf:
      enabled: true
      n_basis: 16
      cutoff: 10.0
    update_coords: true        # EGNN coordinate updates (false = x stays at the input positions,
                               #   EGNN's QM9 setting)
    edge_gate: false           # EGNN soft edge gate m_ij *= sigmoid(.) ("attention")

  wannier:
    max_centers: 28          # pads the TRUE centers per spin (≥ the largest molecule's count)
    spins: [up, down]
    guide_sigma: 0.3         # A; FIXED width of the cloud guide term (below the ~0.6-1 A gap
                             #   between neighboring centers). Never predicted (§6).
    radius_weight: 1.0       # weight of the matched radius regression (normalized by std)
    guide_weight: 0.1        # weight of the fixed-width cloud guide vs matched positions
    select_weight: 1.0       # weight of the candidate-selection term (BCE: matched -> 1)
    singles_per_atom: 2      # candidate centers each atom proposes per spin (model/heads.py)
    pairs_per_atom: 1        # ± candidate pairs per atom per spin (off-plane centers)
    position_loss: l1        # l1 = mean distance (robust to a few far pairs) | mse = squared
    nms_radius: 0.3          # A; selected centers closer than this are merged (true spacing
                             #   >= 0.48 A); candidates this close to a matched one are positives

  train:
    lr: 1.0e-3
    grad_clip: 1.0            # clip global grad norm (stability safety net)
    lr_schedule: cosine        # cosine = warmup then smooth decay to lr*lr_end_frac; or constant
    warmup_epochs: 5           # linear ramp 0 -> lr over the first epochs
    lr_end_frac: 0.01          # final learning rate = 1% of lr
    batch_size: 256          # GPU-sized; drop if you hit device OOM
    epochs: 300
    ckpt_every: 5
    patience: 0               # early stop after N validations without a new best (0 = off)
    ema_decay: 0.99           # weights used for validation/checkpoints = moving average (0 = off)
    seed: 0                   # initialization + batch order
    split_seed: 0             # train/val/test split (keep fixed so runs share one test set)
    val_frac: 0.1
    test_frac: 0.1

# Stage 1 (screening): applied to every run below. Early stopping frees GPUs from poor variants.
stage1_overrides:
  train.epochs: 300
  train.patience: 6             # stop after 6 validations (30 epochs) without a new best

# Stage 2: when every stage-1 run is finished/failed, the best one (lowest val objective; runs
# marked `promote: false` excluded) is re-run as 'final' with these overrides.
stage2_overrides:
  train.epochs: 1000
  train.patience: 0

# Stage-1 runs: seeds first (how much do results vary by chance?), then one change at a time.
# The val objective doesn't depend on the loss forms, so all runs below are comparable.
runs:
  - {name: base_s0, overrides: {train.seed: 0}}
  - {name: base_s1, overrides: {train.seed: 1}}
  - {name: pos_mse, overrides: {wannier.position_loss: mse}}        # v3 position loss
  - {name: nms0, overrides: {wannier.nms_radius: 0.0}}              # no NMS (v3 selection)
  - {name: ema0, overrides: {train.ema_decay: 0.0}}                 # no weight averaging
  - {name: ema0.999, overrides: {train.ema_decay: 0.999}}           # longer averaging
  - {name: layers7, overrides: {model.n_layers: 7}}                 # EGNN's QM9 depth
  - {name: batch96, overrides: {train.batch_size: 96}}              # EGNN's QM9 batch size
  - {name: coords_fixed, overrides: {model.update_coords: false}}   # EGNN's QM9 setting
  - {name: edge_gate, overrides: {model.edge_gate: true}}           # EGNN's edge attention
