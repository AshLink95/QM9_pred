# Planned sweep (docs/sweeps.md). Submit scripts/train-bunch.sh from N jobs; each job claims runs
# from this list until none are left. Editing this file later only ADDS new runs; existing runs
# (by name) are never duplicated or changed.

name: wannier_v2                # runs are written to runs/<name>/
base: configs/gpu.yaml          # every run starts from this config
dataset: dataset.pkl            # read-only, shared by all runs
stale_minutes: 30               # no-heartbeat fallback when squeue can't tell if an owner died

# Stage 1 (screening): applied to every run below. Early stopping frees GPUs from poor variants.
stage1_overrides:
  train.epochs: 300
  train.patience: 6             # stop after 6 validations (30 epochs) without a new best

# Stage 2: when every stage-1 run is finished/failed, the best one (lowest val objective) is
# re-run as 'final' with these overrides: a long run on the full cosine schedule.
stage2_overrides:
  train.epochs: 1000
  train.patience: 0

# Stage-1 runs: seeds first (how much do results vary by chance?), then one change at a time.
runs:
  - {name: base_s0, overrides: {train.seed: 0}}
  - {name: base_s1, overrides: {train.seed: 1}}
  - {name: base_s2, overrides: {train.seed: 2}}
  - {name: guide_w0.03, overrides: {wannier.guide_weight: 0.03}}   # less smooth guidance
  - {name: guide_w0.3, overrides: {wannier.guide_weight: 0.3}}     # more smooth guidance
  - {name: guide_s0.2, overrides: {wannier.guide_sigma: 0.2}}      # sharper guide
  - {name: guide_s0.5, overrides: {wannier.guide_sigma: 0.5}}      # smoother guide
  - {name: radius_w0.3, overrides: {wannier.radius_weight: 0.3}}   # favor positions
  - {name: radius_w3, overrides: {wannier.radius_weight: 3.0}}     # favor radii
  - {name: wannier_l0.3, overrides: {loss.lambda_wannier: 0.3}}    # favor energy
  - {name: wannier_l3, overrides: {loss.lambda_wannier: 3.0}}      # favor Wannier
  - {name: lr_5e-4, overrides: {train.lr: 5.0e-4}}                 # gentler steps
  - {name: big_model, overrides: {model.hidden_dim: 192, model.n_layers: 6}}   # more capacity
